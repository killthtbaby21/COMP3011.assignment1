<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech to Text</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main class="container">

        <h1>Speech to Text</h1>

        <p>
            Record a short message and convert your speech into text.
        </p>

        <div class="controls">
            <button id="recordButton" type="button">
                Start Recording
            </button>

            <button id="stopButton" type="button" disabled>
                Stop Recording
            </button>
        </div>

        <p id="status" aria-live="polite">
            Ready to record.
        </p>

        <section class="result">
            <h2>Transcription</h2>

            <p id="transcription">
                Your transcription will appear here.
            </p>
        </section>

    </main>

    <script src="/js/recorder.js"></script>

</body>
</html>
